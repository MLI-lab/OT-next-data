<meta charset="utf-8">
<title>Task Pipeline Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="style.css">
<header>
  <a class="brand" href="#all">OT-next-data pipeline</a>
  <label class="picker">Datasource
    <select id="dataset"></select>
  </label>
</header>
<main id="view"></main>
<aside id="drawer" hidden>
  <button id="close" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>
<div id="tip" role="tooltip" hidden></div>
<div id="explorer" hidden role="dialog" aria-modal="true" aria-labelledby="ex-title">
  <div class="ex-box">
    <div class="ex-head"><div><h2 id="ex-title"></h2><div id="ex-summary"></div></div><button id="ex-close" aria-label="Close">×</button></div>
    <div class="ex-body"><nav id="ex-files"></nav><div id="ex-view"></div></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="evaluation.js"></script>
<script src="passk-explorer.js"></script>
<script src="app.js"></script>
