[review]
format = "classification"

[[categories]]
name = "CLEAN"
description = "Instruction is clear and self-sufficient, a correct-per-instruction solution passes, AND the verifier genuinely validates correctness: it recomputes/decodes the true answer from the input (or exact-compares against a correct hardcoded answer) rather than merely checking output shape. A hard-but-fair task is still CLEAN."

[[categories]]
name = "VERIFIER-TOO-WEAK"
description = "The verifier passes without the task actually being solved: it checks only output shape/format/types/count, trusts a self-reported value, greps the source for keywords, checks a hardcoded subset, or tests only fixed inputs so the answer can be hardcoded. A fabricated, plausibly-shaped output would pass."

[[categories]]
name = "INSTR-VERIFIER-MISMATCH"
description = "The verifier checks something the instruction does not imply, or contradicts it. For example, reads/writes a different path, asserts a hardcoded value that conflicts with the data, or demands a stricter format. A solution that faithfully follows the instruction still fails."

[[categories]]
name = "INSTR-ENV-MISMATCH"
description = "The instruction or verifier references input paths, files, dependencies, or services the environment does not actually provide, so the task cannot be completed as written (missing data/compiler/service)."

[[categories]]
name = "ANSWER-LEAK"
description = "The instruction itself, or a file shipped in the environment, reveals the expected answer (lists the result, embeds the solution, or provides a ground-truth file), so the task requires no genuine work."

[[categories]]
name = "INSTR-AMBIGUOUS"
description = "The instruction alone is underspecified: a necessary specification is missing, so two equally reasonable interpretations produce different outputs and the verifier accepts only one. Merely admitting multiple valid solution paths is not enough."

[[categories]]
name = "TASK-TRIVIAL"
description = "The task itself is so easy there is no meaningful work or learning signal: write a constant, echo a value, copy a file, regardless of verifier strength."

[[categories]]
name = "OTHER"
description = "A genuine defect fitting none of the above: verifier code that is buggy/crashes; a task needing network/GPU/GUI/hardware the container lacks; non-determinism; a required background service that is never started; or an internally contradictory spec."

[[criteria]]
name = "task_clean"
description = "The task receives CLEAN"
guidance = "Classify the task using exactly one category above."
